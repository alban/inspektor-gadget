name: snapshot process
description: Show running processes
homepageURL: https://inspektor-gadget.io/
documentationURL: https://www.inspektor-gadget.io/docs/latest/gadgets/snapshot_process
sourceURL: https://github.com/inspektor-gadget/inspektor-gadget/tree/main/gadgets/snapshot_process
datasources:
  processes:
    fields:
      start_code:
        annotations:
          columns.hex: true
      end_code:
        annotations:
          columns.hex: true
      start_data:
        annotations:
          columns.hex: true
      end_data:
        annotations:
          columns.hex: true
      start_brk:
        annotations:
          columns.hex: true
      brk:
        annotations:
          columns.hex: true
      start_stack:
        annotations:
          columns.hex: true
      arg_start:
        annotations:
          columns.hex: true
      arg_end:
        annotations:
          columns.hex: true
      env_start:
        annotations:
          columns.hex: true
      env_end:
        annotations:
          columns.hex: true
params:
  ebpf:
    show_threads:
      key: threads
      defaultValue: "false"
      description: Show all threads (by default, only processes are shown)
